[package]
name = "waifu-usage-monitor"
version = "0.1.0"
description = "Windows tray app and usage island that tracks Claude Code, Codex, Cursor and Grok usage limits"
authors = ["leancoderkavy"]
license = "MIT"
repository = "https://github.com/leancoderkavy/waifu-usage-monitor"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
dirs = "7.0.0"
chrono = "0.4.45"
base64 = "0.23.1"
anyhow = "1.0.104"
futures = "0.3.34"
uuid = { version = "1.26.1", features = ["v4"] }
tauri-plugin-notification = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
keyring = { version = "3", features = ["windows-native"] }
sysinfo = "0.39.6"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
